<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Nilesh Kumar Singh – Favicon 64x64">
  <title>Nilesh. – Favicon 64x64</title>
  <!-- Squircle container (radius 10px) -->
  <rect width="64" height="64" rx="10" ry="10" fill="#0F172A"/>
  <defs>
    <!-- Clip path to keep diagonal inside N bounding box -->
    <clipPath id="n-bounds-64">
      <rect x="13.75" y="11.25" width="36.5" height="41.5"/>
    </clipPath>
  </defs>
  <!-- N letterform -->
  <g>
    <!-- Left vertical bar -->
    <rect x="13.75" y="11.25" width="6" height="41.5" fill="#FFFFFF"/>
    <!-- Right vertical bar -->
    <rect x="44.25" y="11.25" width="6" height="41.5" fill="#FFFFFF"/>
    <!-- Diagonal stroke, clipped to bounds -->
    <polygon points="16,9.25 52.5,50.75 48,54.75 11.5,13.25" fill="#FFFFFF" clip-path="url(#n-bounds-64)"/>
  </g>
  <!-- Blue accent dot (r=8px, cx=54.375, cy=50) -->
  <circle cx="54.375" cy="50" r="8" fill="#3B82F6"/>
</svg>
