<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Nilesh Kumar Singh – N logo mark, light theme">
  <title>Nilesh. – N Mark (Light)</title>
  <!-- Squircle container with light border -->
  <rect x="0.5" y="0.5" width="511" height="511" rx="111.5" ry="111.5" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <defs>
    <!-- Clip path to keep diagonal inside N bounding box (110,90) to (402,422) -->
    <clipPath id="n-bounds-light">
      <rect x="110" y="90" width="292" height="332"/>
    </clipPath>
  </defs>
  <!-- N letterform -->
  <g>
    <!-- Left vertical bar -->
    <rect x="110" y="90" width="48" height="332" fill="#0F172A"/>
    <!-- Right vertical bar -->
    <rect x="354" y="90" width="48" height="332" fill="#0F172A"/>
    <!-- Diagonal stroke, clipped to bounds -->
    <polygon points="128,74 420,406 384,438 92,106" fill="#0F172A" clip-path="url(#n-bounds-light)"/>
  </g>
  <!-- Blue accent dot – lower-right of N, r=36 at 512px -->
  <circle cx="435" cy="400" r="36" fill="#3B82F6"/>
</svg>
